<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік відключень — Миколаївобленерго</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1E1C24;
            --text-dark: #6B6874;
            --bg-light: #FAF7F0;
            --text-light: #9B9388;
            --accent-green: #229b59;
            --accent-red: #cd2222;
            --accent-yellow: #edd301;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-dark);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }

        body[data-theme="light"] {
            background: var(--bg-light);
            color: var(--text-light);
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Вибір черги */
        .queue-selection {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-align: center;
            white-space: nowrap;
            width: 100%;
        }

        body[data-theme="light"] .logo {
            color: var(--text-light);
        }

        body:not([data-theme="light"]) .logo {
            color: var(--text-dark);
        }

        .pointing-title {
            display: none;
        }

        .pointing-image {
            display: none;
        }

        h1 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 16px 0;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            width: 100%;
        }

        body[data-theme="light"] h1 {
            color: var(--text-light);
        }

        body:not([data-theme="light"]) h1 {
            color: var(--text-dark);
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 10px;
            background: transparent;
            margin-bottom: 16px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            position: relative;
        }

        body[data-theme="light"] .search-input {
            border: 3px solid var(--text-light);
            color: var(--text-light);
        }

        body:not([data-theme="light"]) .search-input {
            border: 3px solid var(--text-dark);
            color: var(--text-dark);
        }

        .search-input::placeholder {
            opacity: 0.6;
            text-transform: uppercase;
        }

        body[data-theme="light"] .search-input::placeholder {
            color: var(--text-light);
        }

        body:not([data-theme="light"]) .search-input::placeholder {
            color: var(--text-dark);
        }

        body[data-theme="light"] .search-input:focus {
            border-color: var(--text-light);
        }

        body:not([data-theme="light"]) .search-input:focus {
            border-color: var(--text-dark);
        }

        .search-suggestions {
            position: absolute;
            width: 100%;
            border-radius: 10px;
            margin-top: -12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        body[data-theme="light"] .search-suggestions {
            background: var(--text-light);
            color: var(--bg-light);
        }

        body:not([data-theme="light"]) .search-suggestions {
            background: var(--text-dark);
            color: var(--bg-dark);
        }

        .search-suggestions.visible {
            display: block;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        body[data-theme="light"] .suggestion-item {
            border-bottom: 1px solid var(--bg-light);
        }

        body:not([data-theme="light"]) .suggestion-item {
            border-bottom: 1px solid var(--bg-dark);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        body[data-theme="light"] .suggestion-item:hover {
            background: var(--bg-light);
            color: var(--text-light);
        }

        body:not([data-theme="light"]) .suggestion-item:hover {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .queue-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
            margin-top: 16px;
            width: 100%;
        }

        .queue-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
        }

        body[data-theme="light"] .queue-btn {
            background: var(--text-light);
            color: var(--bg-light);
        }

        body:not([data-theme="light"]) .queue-btn {
            background: var(--text-dark);
            color: var(--bg-dark);
        }

        .queue-btn.highlight-on {
            background: var(--accent-green) !important;
            color: white !important;
        }

        .queue-btn.highlight-off {
            background: var(--accent-red) !important;
            color: white !important;
        }

        .queue-btn.highlight-maybe {
            background: var(--accent-yellow) !important;
        }

        body[data-theme="light"] .queue-btn.highlight-maybe {
            color: var(--bg-light) !important;
        }

        body:not([data-theme="light"]) .queue-btn.highlight-maybe {
            color: var(--bg-dark) !important;
        }

        .queue-btn:hover {
            transform: translateY(-2px);
        }

        .queue-btn:active {
            transform: translateY(0);
        }

        .remember-choice {
            display: none;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--bg);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--accent-green);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        body[data-theme="light"] .toggle-slider {
            background: var(--text-light);
        }

        body:not([data-theme="light"]) .toggle-slider {
            background: var(--text-dark);
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(20px);
            background: white;
        }

        /* Статус */
        .status-view {
            display: none;
        }

        .status-view.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body[data-theme="light"] .back-btn {
            color: var(--text-light);
        }

        body:not([data-theme="light"]) .back-btn {
            color: var(--text-dark);
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .back-btn-arrow {
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -8px;
        }

        .back-btn-queue {
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
        }

        body[data-theme="light"] .back-btn-queue {
            border: 4px solid var(--text-light);
        }

        body:not([data-theme="light"]) .back-btn-queue {
            border: 4px solid var(--text-dark);
        }

        .status-hero {
            text-align: center;
            padding: 40px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-indicator {
            width: 240px;
            height: 240px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-indicator img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #lottieContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lottieContainer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-indicator.on {
            /* Лампочка */
        }

        .status-indicator.off {
            /* Лотті анімація */
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            padding: 16px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        body[data-theme="light"] .status-text {
            color: var(--text-light);
            background: transparent;
            border: 4px solid var(--text-light);
        }

        body:not([data-theme="light"]) .status-text {
            color: var(--text-dark);
            background: transparent;
            border: 4px solid var(--text-dark);
        }

        @media (max-width: 480px) {
            .status-text {
                font-size: 10px;
                padding: 12px 16px;
            }
        }

        .expand-btn {
            display: none;
        }

        /* Таймлайн */
        .schedule-timeline {
            margin-top: 8px;
            position: relative;
        }

        .timeline-time-display {
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 8px;
            margin-top: 0;
            min-height: 50px;
            opacity: 1;
            padding: 12px 8px;
            border-radius: 8px;
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .timeline-time-display {
                font-size: 10px;
                padding: 10px 4px;
            }
        }

        .timeline-time-display.status-off {
            background: var(--accent-red);
            color: #8b1717;
            border: 2px solid #8b1717;
        }

        .timeline-time-display.status-on {
            background: var(--accent-green);
            color: #176b3d;
            border: 2px solid #176b3d;
        }

        .timeline-time-display.status-maybe {
            background: var(--accent-yellow);
            color: #a89301;
            border: 2px solid #a89301;
        }

        .day-section {
            margin-bottom: 40px;
        }

        .day-title {
            display: none;
        }

        .timeline-container {
            position: relative;
            padding: 0;
            padding-bottom: 40px;
        }

        .timeline-pointer {
            position: absolute;
            bottom: -5px;
            transform: translateX(-50%);
            cursor: grab;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        .timeline-pointer:active {
            cursor: grabbing;
        }

        .timeline-pointer-triangle {
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            margin: 0 auto;
        }

        body[data-theme="light"] .timeline-pointer-triangle {
            border-bottom: 37px solid var(--text-light);
        }

        body:not([data-theme="light"]) .timeline-pointer-triangle {
            border-bottom: 37px solid var(--text-dark);
        }

        .timeline-pointer-line {
            display: none;
        }

        .timeline-labels-top {
            display: none;
        }

        .timeline {
            display: flex;
            height: 42px;
            position: relative;
            gap: 2px;
        }

        .timeline-segment {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            color: transparent;
            transition: opacity 0.2s;
            position: relative;
            cursor: pointer;
            border-radius: 2px;
        }

        .timeline-segment:hover {
            opacity: 0.9;
        }

        .timeline-segment-label {
            display: none;
        }

        .timeline-segment.off {
            background: var(--accent-red);
        }

        .timeline-segment.off .timeline-segment-label {
            color: var(--accent-red);
        }

        .timeline-segment.on {
            background: var(--accent-green);
        }

        .timeline-segment.on .timeline-segment-label {
            color: var(--accent-green);
        }

        .timeline-segment.maybe {
            background: var(--accent-yellow);
        }

        .timeline-segment.maybe .timeline-segment-label {
            color: var(--accent-yellow);
        }

        .timeline-segment.current-time {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.02);
            }
        }

        .legend {
            display: none;
        }

        /* Offline banner */
        .offline-banner {
            display: none;
            background: var(--accent-yellow);
            text-align: center;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        body[data-theme="light"] .offline-banner {
            color: var(--bg-light);
        }

        body:not([data-theme="light"]) .offline-banner {
            color: var(--bg-dark);
        }

        .offline-banner.visible {
            display: block;
        }

        .offline-notice {
            display: none;
            background: var(--accent-yellow);
            text-align: center;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            margin-top: 16px;
            line-height: 1.5;
            text-transform: uppercase;
        }

        body[data-theme="light"] .offline-notice {
            color: var(--bg-light);
        }

        body:not([data-theme="light"]) .offline-notice {
            color: var(--bg-dark);
        }

        .offline-notice.visible {
            display: block;
        }

        @media (max-width: 640px) {
            .queue-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .timeline {
                height: 35px;
            }

            .logo {
                font-size: 18px;
            }

            h1 {
                font-size: 10px;
            }

            .search-input {
                font-size: 12px;
                padding: 10px 12px;
            }

            .offline-notice {
                font-size: 10px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-banner" id="offlineBanner">
        Немає з'єднання. Показано збережені дані
    </div>

    <div class="container">
        <!-- Вибір черги -->
        <div class="queue-selection" id="queueSelection">
            <div class="logo">МИКОЛАЇВОБЛЕНЕРГО</div>
            <h1>Оберіть вашу чергу щоб перевірити статус</h1>
            
            <div class="search-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="або скористайтеся пошуком за адресою">
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
            
            <div class="queue-grid">
                <button class="queue-btn" data-queue="1.1">1.1</button>
                <button class="queue-btn" data-queue="1.2">1.2</button>
                <button class="queue-btn" data-queue="2.1">2.1</button>
                <button class="queue-btn" data-queue="2.2">2.2</button>
                <button class="queue-btn" data-queue="3.1">3.1</button>
                <button class="queue-btn" data-queue="3.2">3.2</button>
                <button class="queue-btn" data-queue="4.1">4.1</button>
                <button class="queue-btn" data-queue="4.2">4.2</button>
                <button class="queue-btn" data-queue="5.1">5.1</button>
                <button class="queue-btn" data-queue="5.2">5.2</button>
                <button class="queue-btn" data-queue="6.1">6.1</button>
                <button class="queue-btn" data-queue="6.2">6.2</button>
            </div>
            
            <label class="remember-choice">
                <span>Запам'ятати вибір</span>
                <div class="toggle-switch" id="toggleSwitch">
                    <div class="toggle-slider"></div>
                </div>
            </label>

            <div class="offline-notice" id="offlineNotice">
                Ви офлайн і зараз бачите розклад, актуальне на <span id="cacheTime"></span>. Якщо розклад змінився, ви побачите це коли будете онлайн.
            </div>
        </div>

        <!-- Статус -->
        <div class="status-view" id="statusView">
            <button class="back-btn" id="backBtn">
                <span class="back-btn-arrow">‹</span>
                <span class="back-btn-queue" id="backBtnText">Змінити чергу</span>
            </button>
            
            <div class="status-hero">
                <div class="status-indicator" id="statusIndicator">
                    <div id="lottieContainer"></div>
                </div>
                <div class="status-text" id="statusText"></div>
            </div>

            <div class="schedule-timeline" id="scheduleTimeline">
                <div class="timeline-time-display" id="timelineTimeDisplay"></div>
                <div class="day-section">
                    <div class="day-title" id="todayTitle">Сьогодні</div>
                    <div class="timeline-container">
                        <div class="timeline-labels-top" id="todayLabelsTop"></div>
                        <div class="timeline" id="todayTimeline"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API endpoint
        const API_URL = 'https://off.energy.mk.ua';

        // Демо-дані графіків (резервні дані)
        const DEMO_SCHEDULES = {
            '1.1': {
                today: [[0, 2], [4, 10], [12, 18], [20, 24]],
                tomorrow: [[0, 2], [5, 11], [13, 19], [21, 24]]
            },
            '1.2': {
                today: [[0, 6], [8, 14], [16, 22]],
                tomorrow: [[1, 7], [9, 15], [17, 23]]
            },
            '2.1': {
                today: [[0, 4], [6, 12], [14, 20], [22, 24]],
                tomorrow: [[0, 5], [7, 13], [15, 21], [23, 24]]
            },
            '2.2': {
                today: [[0, 6], [8, 14], [16, 22]],
                tomorrow: [[0, 7], [9, 15], [17, 23]]
            },
            '3.1': {
                today: [[0, 4], [6, 12], [14, 20], [22, 24]],
                tomorrow: [[0, 4], [6, 13], [15, 21], [23, 24]]
            },
            '3.2': {
                today: [[0, 1], [4, 8], [10, 16], [18, 24]],
                tomorrow: [[0, 2], [5, 9], [11, 17], [19, 24]]
            },
            '4.1': {
                today: [[0, 3], [6, 9], [12, 15], [18, 21]],
                tomorrow: [[0, 3], [6, 9], [12, 15], [18, 21]]
            },
            '4.2': {
                today: [[3, 6], [9, 12], [15, 18], [21, 24]],
                tomorrow: [[3, 6], [9, 12], [15, 18], [21, 24]]
            },
            '5.1': {
                today: [[0, 4], [8, 12], [16, 20]],
                tomorrow: [[0, 4], [8, 12], [16, 20]]
            },
            '5.2': {
                today: [[4, 8], [12, 16], [20, 24]],
                tomorrow: [[4, 8], [12, 16], [20, 24]]
            },
            '6.1': {
                today: [[0, 6], [12, 18]],
                tomorrow: [[0, 6], [12, 18]]
            },
            '6.2': {
                today: [[6, 12], [18, 24]],
                tomorrow: [[6, 12], [18, 24]]
            }
        };

        // Мапа адрес до черг (приклад - потрібно буде заповнити реальними даними)
        const ADDRESS_TO_QUEUE = {
            'центральна': '1.1',
            'соборна': '1.2',
            'миколаївська': '2.1',
            'адміральська': '2.2',
            'фалєєвська': '3.1',
            'потьомкінська': '3.2',
            'велика морська': '4.1',
            'спаська': '4.2',
            'московська': '5.1',
            'чкалова': '5.2',
            'лягіна': '6.1',
            'декабристів': '6.2'
        };

        // Стан
        let currentQueue = null;
        let scheduleData = null;
        let lottieAnimation = null;
        let isDragging = false;
        let timelineSegments = [];

        // Елементи
        const queueSelection = document.getElementById('queueSelection');
        const statusView = document.getElementById('statusView');
        const queueButtons = document.querySelectorAll('.queue-btn');
        const backBtn = document.getElementById('backBtn');
        const backBtnText = document.getElementById('backBtnText');
        const scheduleTimeline = document.getElementById('scheduleTimeline');
        const timelineTimeDisplay = document.getElementById('timelineTimeDisplay');
        const statusIndicator = document.getElementById('statusIndicator');
        const lottieContainer = document.getElementById('lottieContainer');
        const statusText = document.getElementById('statusText');
        const todayTimeline = document.getElementById('todayTimeline');
        const todayLabelsTop = document.getElementById('todayLabelsTop');
        const offlineBanner = document.getElementById('offlineBanner');
        const offlineNotice = document.getElementById('offlineNotice');
        const cacheTime = document.getElementById('cacheTime');
        const searchInput = document.getElementById('searchInput');
        const searchSuggestions = document.getElementById('searchSuggestions');

        // Тема в залежності від наявності світла
        function updateTheme(hasLight) {
            document.body.setAttribute('data-theme', hasLight ? 'light' : 'dark');
        }

        // За замовчуванням темна тема
        document.body.setAttribute('data-theme', 'dark');

        // Ініціалізація
        function init() {
            // Перевірка offline
            updateOfflineStatus();

            // Перевірка збережених даних
            const saved = localStorage.getItem('selectedQueue');
            if (saved) {
                currentQueue = saved;
                
                // Спробувати завантажити з кешу
                const cached = localStorage.getItem('scheduleCache');
                if (cached) {
                    try {
                        const cacheData = JSON.parse(cached);
                        if (cacheData.queue === currentQueue) {
                            scheduleData = cacheData.schedule;
                            showStatus();
                            updateCacheTimeDisplay(cacheData.timestamp);
                        }
                    } catch (e) {
                        console.error('Помилка читання кешу:', e);
                    }
                }
                
                // Завантажити свіжі дані якщо онлайн
                if (navigator.onLine) {
                    loadScheduleData().then(() => {
                        showStatus();
                    });
                }
            } else {
                // Показуємо екран вибору черги
                queueSelection.style.display = 'flex';
                statusView.classList.remove('active');
            }
        }

        // Оновлення статусу offline
        function updateOfflineStatus() {
            if (!navigator.onLine) {
                offlineBanner.classList.add('visible');
                offlineNotice.classList.add('visible');
            } else {
                offlineBanner.classList.remove('visible');
                offlineNotice.classList.remove('visible');
            }
        }

        // Оновлення часу кешу
        function updateCacheTimeDisplay(timestamp) {
            if (!navigator.onLine && timestamp) {
                const date = new Date(timestamp);
                const timeStr = date.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' });
                cacheTime.textContent = `${dateStr} ${timeStr}`;
                offlineNotice.classList.add('visible');
            }
        }

        // Вибір черги
        queueButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentQueue = btn.dataset.queue;
                
                // Автоматично зберігаємо вибір
                localStorage.setItem('selectedQueue', currentQueue);

                loadScheduleData().then(() => {
                    showStatus();
                });
            });
        });

        // Повернутися
        backBtn.addEventListener('click', () => {
            queueSelection.style.display = 'block';
            statusView.classList.remove('active');
            // Завжди встановлюємо темну тему на екрані вибору черги
            document.body.setAttribute('data-theme', 'dark');
        });

        // Завантаження даних
        async function loadScheduleData() {
            try {
                // Спроба завантажити з API
                const response = await fetch(`${API_URL}/api/schedule?queue=${encodeURIComponent(currentQueue)}`);
                
                if (response.ok) {
                    const data = await response.json();
                    scheduleData = data;
                } else {
                    throw new Error('API недоступний');
                }
            } catch (error) {
                console.log('Використовуємо демо-дані:', error);
                // Використовуємо демо-дані
                scheduleData = DEMO_SCHEDULES[currentQueue];
            }
            
            // Зберігаємо в localStorage
            const cacheData = {
                queue: currentQueue,
                schedule: scheduleData,
                timestamp: Date.now()
            };
            localStorage.setItem('scheduleCache', JSON.stringify(cacheData));
            
            return scheduleData;
        }

        // Показати статус
        function showStatus() {
            queueSelection.style.display = 'none';
            statusView.classList.add('active');

            const now = new Date();
            const currentHour = now.getHours();
            
            // Перевірка, чи є світло зараз
            const hasLight = !isOutageNow(scheduleData.today, currentHour);
            
            // Оновлення теми
            updateTheme(hasLight);

            // Статус індикатор
            statusIndicator.className = 'status-indicator ' + (hasLight ? 'on' : 'off');
            
            // Очистити попередній контент
            lottieContainer.innerHTML = '';
            if (lottieAnimation) {
                lottieAnimation.destroy();
                lottieAnimation = null;
            }

            if (hasLight) {
                // Показати лампочку
                const img = document.createElement('img');
                img.src = 'https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/Objects/Light%20Bulb.webp';
                img.alt = 'Світло є';
                lottieContainer.appendChild(img);
            } else {
                // Показати Lottie анімацію
                lottieAnimation = lottie.loadAnimation({
                    container: lottieContainer,
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: 'https://cdn.changes.tg/gifts/models/Valentine%20Box/lottie/Fuse%20Box.json'
                });
            }

            // Оновити текст кнопки "Назад"
            backBtnText.textContent = `Черга ${currentQueue}`;

            // Статус текст в одну строку
            if (hasLight) {
                const nextOutage = getNextOutage(scheduleData.today, currentHour);
                if (nextOutage !== null) {
                    statusText.textContent = `Світло є, вимкнуть о ${formatTime(nextOutage)}`;
                } else {
                    if (scheduleData.tomorrow && scheduleData.tomorrow.length > 0) {
                        const tomorrowFirst = scheduleData.tomorrow[0][0];
                        statusText.textContent = `Світло є, наступне відключення о ${formatTime(tomorrowFirst)}`;
                    } else {
                        statusText.textContent = `Світло є`;
                    }
                }
            } else {
                const nextRestore = getNextRestore(scheduleData.today, currentHour);
                if (nextRestore !== null) {
                    statusText.textContent = `Світла немає, буде о ${formatTime(nextRestore)}`;
                } else {
                    statusText.textContent = 'Світла немає, інформація оновлюється';
                }
            }

            // Побудова таймлайнів
            renderTimeline(todayTimeline, todayLabelsTop, scheduleData.today);
        }

        // Перевірка відключення зараз
        function isOutageNow(schedule, hour) {
            return schedule.some(([start, end]) => hour >= start && hour < end);
        }

        // Наступне відключення
        function getNextOutage(schedule, hour) {
            for (let [start, end] of schedule) {
                if (hour < start) return start;
            }
            return null;
        }

        // Наступне відновлення
        function getNextRestore(schedule, hour) {
            for (let [start, end] of schedule) {
                if (hour >= start && hour < end) return end;
            }
            return null;
        }

        // Формат часу
        function formatTime(hour) {
            return `${hour.toString().padStart(2, '0')}:00`;
        }

        // Рендер таймлайну
        function renderTimeline(timeline, labelsContainer, schedule) {
            timeline.innerHTML = '';
            labelsContainer.innerHTML = '';
            timelineSegments = [];
            
            // Видаляємо старий вказівник якщо є
            const oldPointer = document.getElementById('timelinePointer');
            if (oldPointer) {
                oldPointer.remove();
            }
            
            // Групуємо години за статусом для створення сегментів
            const segments = [];
            let currentStatus = null;
            let currentStart = 0;
            
            for (let hour = 0; hour < 24; hour++) {
                const isOff = schedule.some(([start, end]) => hour >= start && hour < end);
                const isMaybe = schedule.some(([start, end]) => hour === start || hour === end - 1);
                
                let status;
                if (isOff) {
                    status = isMaybe ? 'maybe' : 'off';
                } else {
                    status = 'on';
                }
                
                if (status !== currentStatus) {
                    if (currentStatus !== null) {
                        segments.push({
                            start: currentStart,
                            end: hour,
                            status: currentStatus
                        });
                    }
                    currentStatus = status;
                    currentStart = hour;
                }
            }
            
            // Додаємо останній сегмент
            if (currentStatus !== null) {
                segments.push({
                    start: currentStart,
                    end: 24,
                    status: currentStatus
                });
            }
            
            timelineSegments = segments;
            
            // Поточний час
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeDecimal = currentHour + currentMinute / 60;
            
            // Створюємо сегменти таймлайну
            segments.forEach((seg, index) => {
                const segment = document.createElement('div');
                segment.className = `timeline-segment ${seg.status}`;
                segment.style.flex = seg.end - seg.start;
                segment.dataset.segmentIndex = index;
                
                // Додаємо клас для поточного часу
                if (currentTimeDecimal >= seg.start && currentTimeDecimal < seg.end) {
                    segment.classList.add('current-time');
                }
                
                // Додаємо обробник кліку на сегмент
                segment.addEventListener('click', (e) => {
                    // Знаходимо центр сегмента
                    const segmentCenter = (seg.start + seg.end) / 2;
                    updatePointerPosition(segmentCenter);
                });
                
                timeline.appendChild(segment);
            });
            
            // Створюємо вказівник
            const pointer = document.createElement('div');
            pointer.className = 'timeline-pointer';
            pointer.id = 'timelinePointer';
            pointer.innerHTML = `
                <div class="timeline-pointer-triangle"></div>
            `;
            
            timeline.parentElement.appendChild(pointer);
            
            // Встановлюємо вказівник на поточний час
            updatePointerPosition(currentTimeDecimal);
            
            // Додаємо обробники для перетягування
            let startX = 0;
            let startLeft = 0;
            
            pointer.addEventListener('mousedown', startDrag);
            pointer.addEventListener('touchstart', startDrag);
            
            function startDrag(e) {
                isDragging = true;
                startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
                const rect = timeline.getBoundingClientRect();
                startLeft = pointer.offsetLeft;
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag);
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
                
                e.preventDefault();
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const deltaX = currentX - startX;
                const rect = timeline.getBoundingClientRect();
                
                let newLeft = startLeft + deltaX;
                newLeft = Math.max(0, Math.min(newLeft, rect.width));
                
                const timeDecimal = (newLeft / rect.width) * 24;
                updatePointerPosition(timeDecimal);
            }
            
            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);
            }
        }
        
        // Оновлення позиції вказівника
        function updatePointerPosition(timeDecimal) {
            const pointer = document.getElementById('timelinePointer');
            if (!pointer) return;
            
            const timeline = document.getElementById('todayTimeline');
            const rect = timeline.getBoundingClientRect();
            
            const percentage = (timeDecimal / 24) * 100;
            pointer.style.left = percentage + '%';
            
            // Знаходимо сегмент для цього часу
            let currentSegment = null;
            let accumulatedHours = 0;
            
            for (let seg of timelineSegments) {
                if (timeDecimal >= seg.start && timeDecimal < seg.end) {
                    currentSegment = seg;
                    break;
                }
            }
            
            if (currentSegment) {
                let statusText = '';
                if (currentSegment.status === 'off') {
                    statusText = 'Аварійне відключення';
                } else if (currentSegment.status === 'maybe') {
                    statusText = 'Можливе відключення';
                } else {
                    statusText = 'Заплановане постачання';
                }
                
                const timeText = `${statusText} з ${formatTime(currentSegment.start)} по ${formatTime(currentSegment.end)}`;
                timelineTimeDisplay.textContent = timeText;
                timelineTimeDisplay.className = 'timeline-time-display status-' + currentSegment.status;
            }
        }

        // Пошук по адресі
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            // Очистити всі підсвічування
            queueButtons.forEach(btn => {
                btn.classList.remove('highlight-on', 'highlight-off', 'highlight-maybe');
            });
            
            if (searchTerm.length === 0) {
                searchSuggestions.classList.remove('visible');
                searchSuggestions.innerHTML = '';
                return;
            }
            
            // Знайти відповідні адреси
            const matches = [];
            for (const [address, queue] of Object.entries(ADDRESS_TO_QUEUE)) {
                if (address.includes(searchTerm)) {
                    matches.push({ address, queue });
                }
            }
            
            if (matches.length > 0) {
                searchSuggestions.innerHTML = '';
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.textContent = `${match.address} (черга ${match.queue})`;
                    item.addEventListener('click', () => {
                        highlightQueue(match.queue);
                        searchInput.value = match.address;
                        searchSuggestions.classList.remove('visible');
                    });
                    searchSuggestions.appendChild(item);
                });
                searchSuggestions.classList.add('visible');
            } else {
                searchSuggestions.classList.remove('visible');
                searchSuggestions.innerHTML = '';
            }
        });

        // Закрити випадаючий список при кліку поза ним
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                searchSuggestions.classList.remove('visible');
            }
        });

        // Функція підсвічування черги
        function highlightQueue(queueNumber) {
            // Очистити всі підсвічування
            queueButtons.forEach(btn => {
                btn.classList.remove('highlight-on', 'highlight-off', 'highlight-maybe');
            });
            
            // Знайти кнопку черги
            const queueBtn = document.querySelector(`[data-queue="${queueNumber}"]`);
            if (queueBtn) {
                // Визначити поточний статус черги
                const schedule = DEMO_SCHEDULES[queueNumber];
                if (schedule) {
                    const now = new Date();
                    const currentHour = now.getHours();
                    
                    const isOff = schedule.today.some(([start, end]) => currentHour >= start && currentHour < end);
                    const isMaybe = schedule.today.some(([start, end]) => currentHour === start || currentHour === end - 1);
                    
                    if (isOff) {
                        queueBtn.classList.add(isMaybe ? 'highlight-maybe' : 'highlight-off');
                    } else {
                        queueBtn.classList.add('highlight-on');
                    }
                    
                    // Прокрутити до кнопки
                    queueBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Offline/Online події
        window.addEventListener('offline', () => {
            updateOfflineStatus();
            // Показати час кешу
            const cached = localStorage.getItem('scheduleCache');
            if (cached) {
                try {
                    const cacheData = JSON.parse(cached);
                    updateCacheTimeDisplay(cacheData.timestamp);
                } catch (e) {
                    console.error('Помилка читання кешу:', e);
                }
            }
        });

        window.addEventListener('online', () => {
            updateOfflineStatus();
            // Оновити дані
            if (currentQueue) {
                loadScheduleData().then(() => {
                    showStatus();
                });
            }
        });

        init();
    </script>
</body>
</html>
